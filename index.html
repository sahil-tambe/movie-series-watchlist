<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Series Watchlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginPage" class="page active">
        <div class="login-container">
            <h1>🎬 Watchlist</h1>
            <form onsubmit="handleLogin(event)">
                <input id="loginEmail" type="email" placeholder="Email" required>
                <input id="loginPassword" type="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p id="loginError" class="error"></p>
            <p class="info">Demo: test@example.com / password123</p>
        </div>
    </div>

    <div id="mainPage" class="page">
        <nav class="navbar">
            <h1>🎬 Watchlist</h1>
            <button onclick="handleLogout()" class="logout-btn">Logout</button>
        </nav>

        <div class="container">
            <div class="search-section">
                <input id="searchInput" type="text" placeholder="Search movies/series..." onkeyup="filterMovies()">
                <select id="categoryFilter" onchange="filterMovies()">
                    <option value="">All Categories</option>
                    <option value="Horror">Horror</option>
                    <option value="Romance">Romance</option>
                    <option value="Drama">Drama</option>
                    <option value="Action">Action</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Comedy">Comedy</option>
                </select>
            </div>

            <div class="content">
                <div class="section">
                    <h2>📺 All Movies & Series</h2>
                    <div id="moviesGrid" class="grid"></div>
                </div>

                <div class="section">
                    <h2>📋 My Watchlist</h2>
                    <div id="watchlistGrid" class="grid"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
